<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZ Scanner — Přehled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --asphalt:#0A0C10;
    --asphalt-2:#14171D;
    --asphalt-3:#1D2129;
    --ink:#111214;
    --amber:#FFB020;
    --amber-dim:#7A5713;
    --text:#ECEDEF;
    --muted:#8B92A0;
    --good:#33D399;
    --bad:#FF6058;
    --line:#262B33;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--asphalt); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }
  #app{min-height:100%; display:flex; flex-direction:column;}
  .screen{position:fixed; inset:0; display:none; flex-direction:column;}
  .screen.active{display:flex;}

  h1,h2{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.02em; margin:0;}

  .btn{
    padding:12px 20px; border-radius:14px; font-size:14.5px; font-weight:600;
    border:none; cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--amber); color:#241a00;}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--text);}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.5; pointer-events:none;}

  /* ---------- LOGIN ---------- */
  #loginScreen{align-items:center; justify-content:center; padding:32px;}
  #loginScreen .login-box{width:100%; max-width:340px;}
  #loginScreen h1{font-size:22px; text-transform:uppercase; margin-bottom:6px;}
  #loginScreen p.hint{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 24px;}
  .field{background:var(--asphalt-2); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
  .field label{display:block; font-size:10.5px; color:var(--muted); font-family:'Roboto Mono',monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .field input{width:100%; background:transparent; border:none; color:var(--text); font-size:15px; font-family:'Inter',sans-serif; padding:2px 0; outline:none;}
  #loginError{color:var(--bad); font-size:12.5px; margin:10px 0 0; display:none; line-height:1.4;}

  /* ---------- LIST ---------- */
  #listScreen{overflow:hidden;}
  .list-top{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 14px; background:var(--asphalt-2);
    border-bottom:1px solid var(--line);
  }
  .list-top h1{font-size:17px; text-transform:uppercase;}
  .list-top .btn{padding:8px 14px; font-size:12.5px;}
  .back-to-app{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:transparent;
    color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; text-decoration:none;
  }
  .search-row{padding:14px 18px 0;}
  .search-row input{
    width:100%; background:var(--asphalt-2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; color:var(--text); font-size:14.5px; font-family:inherit; outline:none;
  }
  #listBody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 24px);}
  .list-empty{text-align:center; color:var(--muted); font-size:13.5px; margin-top:60px; line-height:1.6;}
  .record-item{
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; cursor:pointer;
  }
  .record-item:active{transform:scale(.98);}
  .record-plate{font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; letter-spacing:.05em;}
  .record-meta{font-family:'Roboto Mono',monospace; font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.03em;}
  .record-offense{font-size:13px; color:var(--text); margin-top:8px; line-height:1.4;}
  .record-submitted{font-size:11px; color:var(--muted); margin-top:6px;}

  /* ---------- DETAIL / PREVIEW ---------- */
  #detailScreen{background:#111;}
  .detail-top{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px; background:var(--asphalt-2);
    border-bottom:1px solid var(--line);
  }
  .detail-top .btn{padding:8px 16px; font-size:12.5px;}
  #detailPreviewWrap{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#3a3a3a; display:flex; justify-content:center; padding:12px 0;}
  #detailPreviewWrap canvas{width:100%; max-width:900px; height:auto; display:block; box-shadow:0 4px 24px rgba(0,0,0,.4);}
  #detailLoading{color:var(--muted); font-size:13px; font-family:'Roboto Mono',monospace; margin:auto;}

  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--amber);
    animation:spin 0.8s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-box">
      <h1>RZ Scanner</h1>
      <p class="hint">Přehled odeslaných přestupků. Přihlaste se svým účtem.</p>
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label>Heslo</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="loginSubmitBtn" style="width:100%;">Přihlásit se</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- LIST -->
  <div id="listScreen" class="screen">
    <div class="list-top">
      <div style="display:flex; align-items:center; gap:12px; min-width:0;">
        <a href="https://kokrsnek.github.io/RZ---scanner/index.html" class="back-to-app" title="Zpět do appky">←</a>
        <h1>Přehled přestupků</h1>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Odhlásit</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Hledat podle SPZ nebo ulice…" autocomplete="off">
    </div>
    <div id="listBody">
      <div class="list-empty" id="listStatus">Načítám…</div>
    </div>
  </div>

  <!-- DETAIL -->
  <div id="detailScreen" class="screen">
    <div class="detail-top">
      <span style="font-family:'Roboto Mono',monospace; font-size:12px; color:var(--muted); letter-spacing:.05em;" id="detailPlateLabel">DETAIL</span>
      <div style="display:flex; gap:10px;">
        <a class="btn btn-ghost" id="detailDownloadLink" download style="text-decoration:none; display:flex; align-items:center;">Stáhnout</a>
        <button class="btn btn-primary" id="detailCloseBtn">Zpět</button>
      </div>
    </div>
    <div id="detailPreviewWrap">
      <div id="detailLoading"><div class="spinner"></div>Načítám PDF…</div>
    </div>
  </div>

</div>

<script>
(function(){
  const screens = {
    login: document.getElementById('loginScreen'),
    list: document.getElementById('listScreen'),
    detail: document.getElementById('detailScreen'),
  };
  function show(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBdkI1JIe7cj9EUlzUr2HLGw__abu647bo",
    authDomain: "rzscanner-9e0ed.firebaseapp.com",
    projectId: "rzscanner-9e0ed",
    storageBucket: "rzscanner-9e0ed.firebasestorage.app",
    messagingSenderId: "881625178698",
    appId: "1:881625178698:web:e5d87c9c4dda3bf166bcb3",
    measurementId: "G-0V2HSNXW2L"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let allRecords = [];

  // ---------- Auth ----------
  auth.onAuthStateChanged(user=>{
    if(user){
      show('list');
      loadRecords();
    } else {
      show('login');
    }
  });

  document.getElementById('loginSubmitBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if(!email || !password){
      errEl.textContent = 'Vyplňte e-mail i heslo.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('loginSubmitBtn');
    btn.disabled = true;
    try{
      await auth.signInWithEmailAndPassword(email, password);
      document.getElementById('loginPassword').value = '';
    }catch(e){
      errEl.textContent = 'Přihlášení se nezdařilo — zkontrolujte e-mail a heslo.';
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    auth.signOut();
  });

  // ---------- List ----------
  async function loadRecords(){
    const statusEl = document.getElementById('listStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Načítám…';
    try{
      const snap = await db.collection('prestupky').orderBy('createdAt', 'desc').limit(500).get();
      allRecords = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderList(document.getElementById('searchInput').value);
    }catch(e){
      console.error('Načtení přehledu selhalo:', e);
      statusEl.textContent = 'Načtení se nezdařilo (' + (e && e.message ? e.message : 'chyba sítě') + ').';
      statusEl.style.display = 'block';
    }
  }

  function formatCreatedAt(ts){
    if(!ts || !ts.toDate) return '';
    const d = ts.toDate();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderList(filterText){
    const container = document.getElementById('listBody');
    const statusEl = document.getElementById('listStatus');
    const q = (filterText || '').trim().toLowerCase();

    const filtered = !q ? allRecords : allRecords.filter(r=>
      (r.plate || '').toLowerCase().includes(q) ||
      (r.address || '').toLowerCase().includes(q)
    );

    container.innerHTML = '';
    if(allRecords.length === 0){
      statusEl.textContent = 'Zatím žádné odeslané přestupky.';
      container.appendChild(statusEl);
      return;
    }
    if(filtered.length === 0){
      statusEl.textContent = 'Žádná shoda pro „' + filterText + '“.';
      container.appendChild(statusEl);
      return;
    }

    filtered.forEach(r=>{
      const item = document.createElement('div');
      item.className = 'record-item';

      const plate = document.createElement('div');
      plate.className = 'record-plate';
      plate.textContent = r.plate || 'NEZNÁMÁ SPZ';
      item.appendChild(plate);

      const meta = document.createElement('div');
      meta.className = 'record-meta';
      meta.textContent = (r.date || '') + ' · ' + (r.time || '') + ' · ' + (r.address || '');
      item.appendChild(meta);

      if(r.offenseLabel){
        const off = document.createElement('div');
        off.className = 'record-offense';
        off.textContent = r.offenseLabel;
        item.appendChild(off);
      }

      const sub = document.createElement('div');
      sub.className = 'record-submitted';
      sub.textContent = 'Odesláno ' + formatCreatedAt(r.createdAt) + (r.submittedBy ? ' · ' + r.submittedBy : '');
      item.appendChild(sub);

      item.addEventListener('click', ()=> openDetail(r));
      container.appendChild(item);
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e)=> renderList(e.target.value));

  // ---------- Detail / PDF preview ----------
  function base64ToUint8Array(base64){
    const raw = atob(base64);
    const bytes = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  let lastDetailBlobUrl = null;
  let currentRenderTask = null;
  let currentPdfDoc = null;

  // Cancels any render in progress and releases the previous PDF document's
  // worker resources. Without this, closing the preview while pdf.js is
  // still mid-render leaves its worker in a stuck state — the next thing
  // you try to do in the app (open another PDF, even go back to the list)
  // can hang indefinitely and require a full reload.
  async function cleanupPreview(){
    if(currentRenderTask){
      try{ currentRenderTask.cancel(); }catch(e){}
      currentRenderTask = null;
    }
    if(currentPdfDoc){
      try{ await currentPdfDoc.destroy(); }catch(e){}
      currentPdfDoc = null;
    }
  }

  async function openDetail(record){
    await cleanupPreview();

    document.getElementById('detailPlateLabel').textContent = record.plate || 'DETAIL';
    const wrap = document.getElementById('detailPreviewWrap');
    wrap.innerHTML = '<div id="detailLoading"><div class="spinner"></div>Načítám PDF…</div>';
    show('detail');

    if(lastDetailBlobUrl){ URL.revokeObjectURL(lastDetailBlobUrl); lastDetailBlobUrl = null; }

    if(!record.pdfBase64){
      wrap.innerHTML = '<div id="detailLoading">Tento záznam nemá uložené PDF.</div>';
      return;
    }

    const bytes = base64ToUint8Array(record.pdfBase64);

    // Download link uses a Blob URL (more reliable across browsers than a
    // data: URI for the download attribute).
    const blob = new Blob([bytes], { type: 'application/pdf' });
    lastDetailBlobUrl = URL.createObjectURL(blob);
    const downloadLink = document.getElementById('detailDownloadLink');
    downloadLink.href = lastDetailBlobUrl;
    downloadLink.download = record.filename || ((record.plate || 'prestupek') + '.pdf');

    // Render the PDF onto a canvas ourselves (via pdf.js) rather than
    // relying on the browser's native PDF viewer, which on iOS Safari
    // ignores fit-width hints and shows the page at 100% actual size.
    try{
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      currentPdfDoc = pdf;
      const page = await pdf.getPage(1);
      const containerWidth = Math.min(wrap.clientWidth || 900, 900);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = (containerWidth / baseViewport.width) * 2; // 2x for sharpness
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      const renderTask = page.render({ canvasContext: ctx, viewport });
      currentRenderTask = renderTask;
      await renderTask.promise;
      currentRenderTask = null;
      wrap.innerHTML = '';
      wrap.appendChild(canvas);
    }catch(e){
      // A cancelled render throws by design when the person closes the
      // preview before it finishes — that's expected, not an error.
      if(e && e.name === 'RenderingCancelledException') return;
      console.error('Vykreslení PDF náhledu selhalo:', e);
      wrap.innerHTML = '<div id="detailLoading">Náhled se nepodařilo zobrazit — použijte tlačítko „Stáhnout".</div>';
    }
  }

  document.getElementById('detailCloseBtn').addEventListener('click', async ()=>{
    await cleanupPreview();
    document.getElementById('detailPreviewWrap').innerHTML = '';
    if(lastDetailBlobUrl){ URL.revokeObjectURL(lastDetailBlobUrl); lastDetailBlobUrl = null; }
    show('list');
  });

})();
</script>
</body>
</html>
